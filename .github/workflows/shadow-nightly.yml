name: shadow-nightly

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Business date (YYYY-MM-DD, default today UTC)"
        required: false
      transactions:
        description: "Synthetic transactions"
        required: false
        default: "250"

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure compose user
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Start estate
        run: docker compose up -d --build --wait
      - name: Build COBOL estate
        run: make build
      - name: Shadow run on a synthetic day
        env:
          DAY: ${{ inputs.date }}
          COUNT: ${{ inputs.transactions || '250' }}
        run: |
          DAY="${DAY:-$(date -u +%F)}"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          make shadow SHADOW_ARGS="--synthetic $COUNT --date $DAY"
      - name: Publish report
        if: always()
        run: |
          if [ -f "work/shadow/$DAY/report.md" ]; then
            cat "work/shadow/$DAY/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-${{ env.DAY }}
          path: work/shadow/
