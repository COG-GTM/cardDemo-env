name: estate-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure compose user
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Start estate
        run: docker compose up -d --build --wait
      - name: Build COBOL estate
        run: make build
      - name: Run transfer-fee chain
        run: |
          set -o pipefail
          make run CHAIN=xferfee 2>&1 | tee work/ci-chain.log
          grep -q 'MAXCC=0000' work/ci-chain.log
      - name: Run self parity
        run: make parity
      - name: Verify naive parity is intentionally different
        run: |
          if make parity-naive CASE=half_cent; then
            echo "half_cent naive parity unexpectedly passed"
            exit 1
          fi
      - name: Run dead-code split
        run: make deadcode
      - name: Check chain graph
        run: make chain-graph-check
      - name: Check generated fixtures
        run: python3 tools/fixtures/gen_fixtures.py --check
      - name: Upload estate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-work-and-logs
          path: |
            work/
            ops/smf/job_activity.csv

  parity-java:
    # COG-1251: Java port parity-gated against the COBOL recordings, in-process and as real
    # Kafka + Postgres services. Must pass (no continue-on-error); mark as a required check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configure compose user
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Java unit tests
        run: make java-test
      - name: Parity (in-process, batch-atomic)
        run: make parity-java PARITY_JAVA_RUNNER=host
      - name: Parity (in-process, per-transfer)
        run: make parity-java PARITY_JAVA_RUNNER=host POSTING_MODE=per-transfer
      - name: Start event-mode stack (Kafka, Postgres, services, outbox relay)
        run: make up-java
      - name: Parity (events, batch-atomic)
        run: make parity-java JAVA_MODE=events
      - name: Parity (events, per-transfer)
        run: make parity-java JAVA_MODE=events POSTING_MODE=per-transfer
      - name: Service logs
        if: always()
        run: docker compose --profile java logs --no-color > work/java-services.log 2>&1 || true
      - name: Upload Java parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-java
          path: |
            work/parity-java/
            work/java-services.log
