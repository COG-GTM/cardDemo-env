name: estate-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure compose user
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Start estate
        run: docker compose up -d --build --wait
      - name: Build COBOL estate
        run: make build
      - name: Run transfer-fee chain
        run: |
          set -o pipefail
          make run CHAIN=xferfee 2>&1 | tee work/ci-chain.log
          grep -q 'MAXCC=0000' work/ci-chain.log
      - name: Run self parity
        run: make parity
      - name: Verify naive parity is intentionally different
        run: |
          if make parity-naive CASE=half_cent; then
            echo "half_cent naive parity unexpectedly passed"
            exit 1
          fi
      - name: Run Java parity (expected to fail until stages land)
        id: parity_java
        continue-on-error: true
        run: |
          set -o pipefail
          make parity-java CASE=default 2>&1 | tee work/java-parity.log
      - name: Publish Java parity report
        if: always()
        run: |
          {
            echo "## Java parity: xferfee / default"
            echo
            echo "Outcome: \`${{ steps.parity_java.outcome }}\` (allowed to fail)"
            echo
            if [ -f work/parity/default/java-report.md ]; then
              cat work/parity/default/java-report.md
            else
              echo "No report produced; see the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run dead-code split
        run: make deadcode
      - name: Check chain graph
        run: make chain-graph-check
      - name: Check generated fixtures
        run: python3 tools/fixtures/gen_fixtures.py --check
      - name: Upload estate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-work-and-logs
          path: |
            work/
            ops/smf/job_activity.csv
