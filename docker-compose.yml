services:
  db:
    image: postgres:15
    pull_policy: missing
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d carddemo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - carddemo-db:/var/lib/postgresql/data
      - ./db2/ddl/CTL_XFER_PARM.sql:/docker-entrypoint-initdb.d/01-ctl.sql:ro
      - ./db2/ddl/XFER_FEE_LEDGER.sql:/docker-entrypoint-initdb.d/02-ledger.sql:ro
      - ./db2/data/CTL_XFER_PARM.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro

  estate:
    pull_policy: missing
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${ESTATE_BASE_IMAGE:-ubuntu:22.04}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/estate
    environment:
      OCDB_NAME: carddemo
      OCDB_USER: carddemo
      OCDB_PASS: carddemo
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: carddemo
      PGUSER: carddemo
      PGPASSWORD: carddemo
    command: ["sleep", "infinity"]

  mvs:
    profiles: ["mvs"]
    build:
      context: tools/kicks
    image: carddemo-mvs
    container_name: carddemo-mvs
    ports:
      - "3270:3270"
      - "8038:8038"
      - "3505:3505"
    volumes:
      - mvs-dasd:/opt/mvs/dasd
      - ./copybook:/opt/carddemo/copybook:ro
      - ./fixtures:/opt/carddemo/fixtures:ro
      - ./tools/kicks/out:/opt/kicks/out
    environment:
      CARDDEMO_REPO: /opt/carddemo
    stop_grace_period: 90s

volumes:
  carddemo-db:
  mvs-dasd:
