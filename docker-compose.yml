x-java-image: &java-image
  image: carddemo-xferfee-java:local
  pull_policy: build
  build:
    context: ./java
    args:
      MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}

x-java-env: &java-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  XFERFEE_DB_URL: jdbc:postgresql://db:5432/carddemo
  XFERFEE_DB_USER: carddemo
  XFERFEE_DB_PASSWORD: carddemo
  FEE_SCHEDULE_URL: http://fee-schedule-service:8081
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50

services:
  db:
    image: postgres:15
    pull_policy: missing
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d carddemo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - carddemo-db:/var/lib/postgresql/data
      - ./db2/ddl/CTL_XFER_PARM.sql:/docker-entrypoint-initdb.d/01-ctl.sql:ro
      - ./db2/ddl/XFER_FEE_LEDGER.sql:/docker-entrypoint-initdb.d/02-ledger.sql:ro
      - ./db2/data/CTL_XFER_PARM.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro

  estate:
    pull_policy: missing
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${ESTATE_BASE_IMAGE:-ubuntu:22.04}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/estate
    environment:
      OCDB_NAME: carddemo
      OCDB_USER: carddemo
      OCDB_PASS: carddemo
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: carddemo
      PGUSER: carddemo
      PGPASSWORD: carddemo
    command: ["sleep", "infinity"]

  # --- event mode (COG-1251): `docker compose --profile java up -d --wait` ---
  kafka:
    image: apache/kafka:3.7.0
    pull_policy: missing
    profiles: ["java"]
    environment:
      CLUSTER_ID: xferfee-kraft-cluster-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  fee-schedule-service:
    <<: *java-image
    profiles: ["java"]
    environment:
      <<: *java-env
      SERVER_PORT: "8081"
    command: ["java", "-Dloader.main=com.carddemo.xferfee.services.feeschedule.FeeScheduleServiceApplication", "-jar", "/app/event-services.jar"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 60

  transfer-intake-service:
    <<: *java-image
    profiles: ["java"]
    environment:
      <<: *java-env
      SERVER_PORT: "8082"
    command: ["java", "-Dloader.main=com.carddemo.xferfee.services.intake.TransferIntakeServiceApplication", "-jar", "/app/event-services.jar"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 60

  account-posting-service:
    <<: *java-image
    profiles: ["java"]
    environment:
      <<: *java-env
      SERVER_PORT: "8083"
    command: ["java", "-Dloader.main=com.carddemo.xferfee.services.posting.AccountPostingServiceApplication", "-jar", "/app/event-services.jar"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fee-schedule-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 60

  reconciliation-service:
    <<: *java-image
    profiles: ["java"]
    environment:
      <<: *java-env
      SERVER_PORT: "8084"
    command: ["java", "-Dloader.main=com.carddemo.xferfee.services.recon.ReconciliationServiceApplication", "-jar", "/app/event-services.jar"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 60

  outbox-relay:
    <<: *java-image
    profiles: ["java"]
    environment:
      <<: *java-env
      SERVER_PORT: "8085"
    command: ["java", "-jar", "/app/outbox-relay.jar"]
    depends_on:
      fee-schedule-service:
        condition: service_healthy
      transfer-intake-service:
        condition: service_healthy
      account-posting-service:
        condition: service_healthy
      reconciliation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8085/actuator/health | grep -q UP"]
      interval: 3s
      timeout: 3s
      retries: 60

  # One-shot replay used by `make parity-java` (docker runner); never started by `up`.
  parity-replay:
    <<: *java-image
    profiles: ["parity"]
    pull_policy: missing
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /estate
    volumes:
      - .:/estate
    environment:
      <<: *java-env
    entrypoint: ["java", "-jar", "/app/parity-replay.jar"]

volumes:
  carddemo-db:
