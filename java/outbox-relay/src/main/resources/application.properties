spring.application.name=outbox-relay
server.port=${SERVER_PORT:8085}
spring.datasource.url=${XFERFEE_DB_URL:jdbc:postgresql://localhost:5432/carddemo}
spring.datasource.username=${XFERFEE_DB_USER:carddemo}
spring.datasource.password=${XFERFEE_DB_PASSWORD:carddemo}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
xferfee.relay.schemas=fee_schedule,intake,posting,recon
xferfee.relay.batch-size=500
xferfee.relay.poll-ms=200
management.endpoints.web.exposure.include=health,info
