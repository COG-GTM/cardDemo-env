spring.datasource.url=${XFERFEE_DB_URL:jdbc:postgresql://localhost:5432/carddemo}
spring.datasource.username=${XFERFEE_DB_USER:carddemo}
spring.datasource.password=${XFERFEE_DB_PASSWORD}
spring.flyway.schemas=${xferfee.schema}
spring.flyway.locations=classpath:db/migration/${xferfee.schema}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.listener.ack-mode=record
management.endpoints.web.exposure.include=health,info
xferfee.fee-schedule-url=${FEE_SCHEDULE_URL:http://localhost:8081}
